name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: 0.3.0
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Workspace types resolve through dist/index.d.mts on a fresh checkout.
      - run: vp pack
      - run: vp check
      - run: vp test
      - run: vp run demo:build
      - run: vp pm pack --out "${RUNNER_TEMP}/oklch-ramp.tgz"
